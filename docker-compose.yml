# docker compose up --build      (then open http://localhost:8000; Ctrl+C or `docker compose down` to stop)
services:
  netvista:
    build: .
    image: netvista
    privileged: true        # Mininet needs namespaces, veths, tc and the host's openvswitch module
    ports:
      - "8000:8000"
    env_file:
      - path: .env          # GEMINI_API_KEY, GROQ_API_KEY ... (optional)
        required: false
    volumes:
      - netvista-runs:/app/runs
    stop_grace_period: 20s
volumes:
  netvista-runs:
