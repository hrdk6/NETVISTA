[project]
name = "netvista"
version = "1.0.0"
description = "Visual network digital twin backed by a real Mininet emulation"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7,<3",
  "networkx>=3.2",
  "simpy>=4.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "emulation: boots a real Mininet network (needs root + mininet + openvswitch)",
]
addopts = "-ra"
